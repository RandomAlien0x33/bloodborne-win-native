# bbport settings. The game's System menu and the port's menu (Insert) change them.
# game_dir: the game folder (with eboot.bin); empty: CUSA03173 inside this folder or next to it.
# save_dir: the folder for saves (it holds savedata); empty: user\ in this folder.
# memory_model: classic (default) or hybrid (faster, newer).
game_dir=
save_dir=
menu_language=en
upscaler=dlss
preset=1
sharpen=1
sharpness=1.00
jitter=1
reactive=1
object_motion=1
reactive_scale=1.00
reactive_threshold=0.30
reactive_max=0.90
debug_view=0
show_fps=1
fsr4_auto_exposure=1
fsr4_invert_jitter=0
effect_chromatic_aberration=1
effect_dof=1
effect_motion_blur=1
effect_ssao=1
effect_game_aa=1
effect_dynamic_shadows=1
effect_ssr=0
skip_intro=1
debug_camera=1
debug_menu=0
model_lod=-2
output_res=1920x1080
fullscreen=0
live_resolution=0
memory_model=classic
mouse_camera=1
mouse_sensitivity=5.00
mouse_invert_y=0
